{% extends '@layout.html' %}

{% block body %}
    <div class="p-5">
        <div id="items" class="flex flex-col gap-2">
            {% for item in items %}
            <div class="hover:bg-slate-400 cursor-pointer p-2 grid grid-cols-[0fr_1fr] gap-4">
                <div class="w-20 min-h-15 h-full bg-black"></div>
                <div>
                    <span>{{item.webdriver_type}}</span>
                    <span>{{item.version}}</span>
                    {% if item.is_running %}
                        <td>yes <a href="javascript:fetch('/api/webdrivers/stop?id={{item.id}}', {method: 'PATCH'})">(stop)</a></td>
                    {% else %}
                        <td>no</td>
                    {% endif %}
                </div>
            </div>
            {% endfor %}
        </div>
        <hr>

        <span>webdrivers.current: {{current_index}}</span>

        <hr>

        <a href="javascript:d()">download</a>
    </div>

    <script>
        async function d() {
            const f = await fetch('/api/webdrivers/download', {'method': 'POST'})
            const da = await f.json()
            location.reload()
        }
    </script>
{% endblock %}

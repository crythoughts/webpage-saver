{% extends '@layout.html' %}

{% block body %}

<div class="p-5 pl-10 pr-10 pb-10">
    <div class="pb-5">
        <b class="text-2xl">{{page.title}} is connected to...</b>

        <div>
            <form method="GET" id="f">
                <input type="hidden" name="mode" value="linked">
                <label>
                    <input onchange="f.submit()" type="checkbox" name="every" {% if every_pages %}checked{% endif %}>
                    Every pages with this URL
                </label>
            </form>
        </div>
    </div>

    <div class="pt-5 flex flex-wrap">
        {% for item in linked %}
            <a title="{{item.url}}" href="/page/{{item.identify}}?mode=meta" class="hover:bg-slate-100 p-5 h-50 w-50 inline-block">
                <img class="w-full" src="{{item.getScreenshotURL()}}">

                <div>
                    <b>{{item.getShortTitle(60)}}</b>
                </div>
            </a>
        {% endfor %}
    </div>
</div>

{% endblock %}

{% extends '@layout.html' %}

{% block title %}
Archive page
{% endblock %}

{% block body %}
<div class="pt-5 pb-10 pl-5 pr-5">
    <div>
        <b class="text-xl">Archive page</b>
    </div>
    <div class="pt-5 grid grid-rows-[1fr_0fr] md:grid-cols-[1fr_0fr] gap-5 pl-15">
        <form class="pr-20" id="main_save_form">
            <div>
                <b>URL</b>
                <input placeholder="URL to save" class="w-full rounded bg-purple-400 pt-2 pb-2 pr-3 pl-3 text-white" type="text" id="url" name="url">
            </div>
            <div>
                <b>Webdriver</b>
                <select name="webdriver" class="block bg-white px-2 py-1">
                    {% for w in webdrivers %}
                        <option value="{{w.id}}" {% if w.id == webdrivers_index %}selected{% endif %} value="{{w.id}}">{{w.webdriver_type}} {{w.version}}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <b>Scrolling</b>
                <div>
                    <label>
                        <input type="checkbox" value="1" name="scroll_down" checked>
                        Scroll down
                    </label>
                    <label>
                        <input class="bg-white" type="number" name="scroll_times" value="5">
                        times
                    </label>
                </div>
            </div>
            <div>
                <b>Sleep</b>
                <div>
                    <input class="bg-white" type="number" name="sleep_before_crawl_s" value="1">
                </div>
            </div>
            <div>
                <b>Assets</b>
                <div>
                    <label>
                        <input type="checkbox" value="1" name="ignore_no_length">
                        Do not download assets without content-length
                    </label>
                </div>
                <div>
                    <span>Do not download assets bigger than <input min="0" value="30" class="bg-white w-20" type="number" name="max_asset_size_mb"> MB</span>
                </div>
            </div>
            <div class="text-right">
                <input onclick="save_ws(document.querySelector('#url').value)" id="save" class="mt-5 w-20 cursor-pointer pt-2 pb-2 pr-3 pl-3 rounded bg-slate-300" type="button" value="Archive">
            </div>
        </form>
        <div class="w-full md:w-50 h-full flex flex-col" id="itms"></div>
    </div>

</div>

<script>
    (function() {
        const u = new URL(location.href)
        const p = u.searchParams.get('preset_url')
        const a = u.searchParams.get('auto_run') == 1
        if (p == null) {
            return
        }

        url.value = p

        if (a) {
            save.click()
        }
    })()
</script>

{% endblock %}

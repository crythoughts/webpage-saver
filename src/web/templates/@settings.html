{% extends '@layout.html' %}

{% block body %}
    <div class="p-5">
        <form method="POST" class="flex flex-col items-center w-full px-[10%]">
            <div>
                <b class="text-xl">Page display</b>

                <div>
                    <b>On links clicking</b>
                </div>
                <div class="flex flex-col">
                    <label>
                        <input type="checkbox" name="a"{% if config.get('navigation_save') == 1 %} checked{% endif %}>
                        Automatically save pages
                    </label>
                    <label>
                        <input type="checkbox" name="b"{% if config.get('navigation_first_found', 1) == 1 %} checked{% endif %}>
                        Go to the first found page (with nearest creation date) if it not presented in found pages
                    </label>
                    <label>
                        <input type="checkbox" name="r"{% if config.get('remove_scripts_by_default', 1) == 1 %} checked{% endif %}>
                        Remove scripts by default
                    </label>
                </div>
                <b class="text-xl">Saving</b>
                <div>
                    <div>
                        Default webdriver:
                        {{config.get('webdrivers.current')}}
                    </div>
                </div>
                <input class="rounded pt-2 pb-2 bg-indigo-200 w-20 text-sm text-center" type="submit" value="Save">
            </div>
        </form>
    </div>
{% endblock %}

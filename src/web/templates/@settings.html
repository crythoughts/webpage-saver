{% extends '@layout.html' %}

{% block body %}
    <div class="p-5">
        <form method="POST" class="flex flex-col items-center w-full">
            <div>
                <label>
                    <input type="checkbox" name="a"{% if config.get('navigation_save') == 1 %} checked{% endif %}>
                    Automatically save pages when navigating within saved page
                </label>
                <div>
                    Default webdriver:
                    {{config.get('webdrivers.current')}}
                </div>
            </div>
            <input class="rounded pt-2 pb-2 bg-indigo-200 w-20 text-sm text-center" type="submit" value="Save">
        </form>
    </div>
{% endblock %}

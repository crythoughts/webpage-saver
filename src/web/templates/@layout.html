{% extends '@page.html' %}

{% block page %}

<div class="w-full bg-gray-purple p-2 pr-5 pl-2 pb-4 flex justify-between">
    <div class="flex ml-6">
        <div class="flex items-center">
            <a class="pr-5 text-gray-300" href="/settings">Settings</a>
            <a href="/" class="block bg-black w-8 h-8"></a>
        </div>

        <form action="/page/search" class="pl-5">
            <input {% if append_to_header %}value="{{q}}"{% endif %} name="q" id="global_query" placeholder="Find by URL..." class="rounded pr-3 pl-3 w-70 h-full bg-stone-200" type="text" id="search_bar">
            <input class="rounded pr-2 pl-2 pt-1 pb-1 bg-purple-400 cursor-pointer" type="submit" value="Find">
            <input class="rounded pr-2 pl-2 pt-1 pb-1 bg-purple-400 cursor-pointer" type="button" value="Save" onclick="fastSaveByURL(global_query)">

            {% if append_to_header %}
                <label class="pl-2 text-gray-300 inline-block">
                    <input type="checkbox" name="exact_match"{% if exact_match %} checked{% endif %}>

                    Exact match
                </label>
            {% endif %}
        </form>
    </div>
    <div class="hidden">
        <div class="w-8 h-8 bg-indigo-500"></div>
    </div>
</div>

<div id="content" class="grid grid-cols-[0fr_1fr]">
    <div class="w-40 pr-5">
        {% if back_btn %}
            <a href="{{back_btn}}" class="font-medium flex block h-full pl-15 pt-5">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="mi-solid mi-arrow-back" viewBox="0 0 24 24">
                    <path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42a.996.996 0 0 0-1.41 0l-6.59 6.59a.996.996 0 0 0 0 1.41l6.59 6.59a.996.996 0 1 0 1.41-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1"/>
                </svg>

                Back
            </a>
        {% endif %}
    </div>
    <div class="bg-slate-200 h-auto">
        {% block body %}{% endblock %}
    </div>
</div>

{% endblock %}

{% extends '@layout.html' %}

{% block body %}
    <form class="p-5" method="get">
        <input type="hidden" name="id", value="{{id}}">
        <input type="hidden" name="mode", value="page">

        <div class="flex gap-5">
            <div class="w-50">
                <div>
                    <b>Encoding</b>
                    <div>
                        <select class="font-bold text-xs bg-white pt-1 pb-1 pl-5 pr-5" name="encoding">
                            {% for enc in page.encodings %}
                                <option {% if enc == page.encoding %}checked{% endif %} value="{{enc}}">{{enc}}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div>
                    <b>Display options</b>
                    <div class="flex flex-col">
                        <label>
                            <input type="checkbox" name="remove_scripts">
                            Remove scripts
                        </label>
                        <label>
                            <input type="checkbox" name="remove_styles">
                            Remove styles
                        </label>
                        <label>
                            <input type="checkbox" name="remove_iframes">
                            Remove iframes
                        </label>
                        <div class="flex flex-col">
                            <b>Remove selectors</b>
                            <textarea class="pt-2 pl-4 bg-white" type="text" placeholder="separated by commas" name="remove_selectors"></textarea>
                        </div>
                    </div>
                </div>

                <input class="rounded mt-5 bg-indigo-400 p-2 text-xl text-white w-50" type="submit" value="Show">
            </div>
            <div class="flex flex-col pt-5 gap-none text-x">
                <a href="/page/{{page.identify}}?mode=text">Text only</a>
                <a href="/page/{{page.identify}}?mode=media">Media</a>
                <a href="/page/{{page.identify}}?mode=metatags">Meta</a>
                <a href="/page/{{page.identify}}?mode=hyperlinks">Hyperlinks</a>
                <a href="/page/{{page.identify}}?mode=all_assets">HTTP requests</a>
            </div>
        </div>

    </form>
{% endblock %}
